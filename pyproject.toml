[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shellsuite"
version = "0.1.0"
description = "ShellSuite: webshell generation and management (ShellShock) - academic project."
readme = "README_EN.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
shellsuite = "shellsuite.cli:main"

[tool.setuptools.packages.find]
include = ["shellsuite*", "shellshock*", "shellblock*"]

[tool.setuptools.package-data]
"shellshock.creator" = ["templates/*.tmpl"]
"shellsuite.gui" = ["assets/*.png"]
