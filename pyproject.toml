[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shellsuite"
version = "0.1.0"
description = "ShellSuite: webshell generation, management and detection (ShellShock + ShellBlock) - academic project."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["tree-sitter>=0.23", "tree-sitter-php>=0.23", "pyshark>=0.6"]

[project.scripts]
shellsuite = "shellsuite.cli:main"

[tool.setuptools.packages.find]
include = ["shellsuite*", "shellshock*", "shellblock*"]

[tool.setuptools.package-data]
"shellshock.creator" = ["templates/*.tmpl"]
"shellsuite.gui" = ["assets/*.png"]
"shellblock" = ["*.json"]
